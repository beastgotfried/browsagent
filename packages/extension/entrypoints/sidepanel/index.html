<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browsagent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="root">
      <header class="head">
        <h1>browsagent</h1>
        <span id="state" class="pill">offline</span>
      </header>
      <p class="hint">
        Click the browsagent icon in the toolbar, then click an element. Or
        press <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd>.
      </p>
      <form id="problem-form">
        <div>
          <label for="problem-type">The kind of problem</label>
          <select id="problem-type"></select>
        </div>
        <div>
          <textarea id="problem-text" placeholder="What is wrong?"></textarea>
        </div>
        <div>
          <button id="problem-send" type="submit">Send the repair request</button>
        </div>
        <div id="answer" class="hint"></div>
      </form>
      <pre id="record">No selection.</pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
